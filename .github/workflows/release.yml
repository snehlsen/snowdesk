name: Release

# Push a tag matching the version in src/snowdesk/__init__.py to publish:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# The build is ad-hoc signed and not notarized (REMAINING.md 1.3), so macOS
# quarantines the downloaded .dmg and Gatekeeper blocks the first launch; the
# release notes say how to get past that.  Signing and notarization slot in
# between "Build the app" and "Build the dmg" once there is a Developer ID.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Two pushes of the same tag must not race to create the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: macos-14 # arm64, matching target_arch in packaging/snowdesk.spec
    permissions:
      contents: write # only this job, and only to create the release
    steps:
      # Pinned to commit SHAs, as in ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Check the tag matches the version
        id: version
        run: |
          version=$(uv run python -c "import snowdesk; print(snowdesk.__version__)")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build the app
        run: uv run pyinstaller packaging/snowdesk.spec --noconfirm

      # --selftest exists because PyInstaller reports success on bundles that
      # cannot import the connector's native pieces; this is where that shows.
      - name: Self-test the bundle
        run: dist/SnowDesk.app/Contents/MacOS/snowdesk --selftest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build the dmg
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dmg="SnowDesk-${VERSION}-arm64.dmg"
          mkdir -p dmg-stage
          # ditto, not cp -R: it keeps the bundle's symlinks and extended
          # attributes, which the framework layout and signature depend on.
          ditto dist/SnowDesk.app dmg-stage/SnowDesk.app
          ln -s /Applications dmg-stage/Applications
          # hdiutil warns that it is deprecated on newer macOS, but the
          # `diskutil image` replacement does not exist on macos-14.
          hdiutil create -volname SnowDesk -srcfolder dmg-stage -fs HFS+ -format UDZO "$dmg"
          shasum -a 256 "$dmg" > SHA256SUMS
          echo "path=${dmg}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          cat > notes.md <<'EOF'
          **Apple Silicon only.** This build is not signed with a Developer ID
          or notarized, so macOS blocks it the first time. After dragging
          SnowDesk to Applications, either open it once and then allow it under
          System Settings ▸ Privacy & Security ▸ *Open Anyway*, or run:

          ```
          xattr -dr com.apple.quarantine /Applications/SnowDesk.app
          ```

          Check the download against `SHA256SUMS` with `shasum -a 256 -c SHA256SUMS`.
          EOF
          gh release create "$GITHUB_REF_NAME" "$DMG" SHA256SUMS \
            --verify-tag --title "SnowDesk ${GITHUB_REF_NAME}" \
            --notes-file notes.md --generate-notes
