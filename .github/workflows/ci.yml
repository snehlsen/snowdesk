name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      # Pinned to commit SHAs, not tags: a tag is mutable, so `@v4` is a
      # standing agreement to run whatever that repository points it at on the
      # day the workflow runs. The trailing comment is the version, for
      # anything that bumps these.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      # --locked fails if uv.lock is out of date with pyproject.toml,
      # rather than quietly resolving something else.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Integration tests are opt-in and never run in CI.
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
