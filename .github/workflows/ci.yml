name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --locked fails if uv.lock is out of date with pyproject.toml,
      # rather than quietly resolving something else.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Integration tests are opt-in and never run in CI.
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
