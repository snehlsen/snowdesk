[project]
name = "snowdesk"
version = "0.1.0"
description = "A lightweight macOS client for Snowflake"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "snowflake-connector-python>=3.12",
]

[project.scripts]
snowdesk = "snowdesk.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowdesk"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The spec embeds illustrative code; it is documentation, not source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["snowdesk"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["snowdesk.db.*", "snowdesk.controllers.*", "snowdesk.storage.*", "snowdesk.util.*"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["snowflake.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires a real Snowflake account (opt-in)"]
