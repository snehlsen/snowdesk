[project]
name = "snowdesk"
# Read from src/snowdesk/__init__.py, which the app bundle and the release
# workflow also take it from.
dynamic = ["version"]
description = "A lightweight macOS client for Snowflake"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    # The extra brings keyring, without which the connector cannot reach the
    # Keychain on macOS and caches no SSO, MFA or OAuth token at all (C4).
    "snowflake-connector-python[secure-local-storage]>=3.12",
]

[project.scripts]
snowdesk = "snowdesk.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/snowdesk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/snowdesk"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The spec embeds illustrative code; it is documentation, not source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["snowdesk"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["snowdesk.db.*", "snowdesk.controllers.*", "snowdesk.storage.*", "snowdesk.util.*"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["snowflake.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires a real Snowflake account (opt-in)"]
# Deprecated calls inside snowflake-connector-python itself (still present in 4.8.0).
filterwarnings = [
    "ignore:X509.get_subject is deprecated:DeprecationWarning:snowflake.connector",
    "ignore:codecs.open\\(\\) is deprecated:DeprecationWarning:snowflake.connector",
]
